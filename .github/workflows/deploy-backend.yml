# Ships the frontend and the Rust backend to the EC2 VM with backend/deploy/vm.sh.
# Needs repo secrets VM_HOST (ubuntu@<ip>), VM_SSH_KEY and ENV_LOCAL; without them it skips.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check EC2 deploy secrets
        id: ready
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          if [ -n "$VM_HOST" ] && [ -n "$VM_SSH_KEY" ] && [ -n "$ENV_LOCAL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EC2 deploy skipped: set the VM_HOST, VM_SSH_KEY and ENV_LOCAL repo secrets to deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Write deploy credentials
        if: steps.ready.outputs.ok == 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: |
          install -m 600 /dev/null ~/vm_key
          printf '%s\n' "$VM_SSH_KEY" > ~/vm_key
          install -m 600 /dev/null .env.local
          printf '%s\n' "$ENV_LOCAL" > .env.local

      - name: Deploy to EC2 with vm.sh
        if: steps.ready.outputs.ok == 'true'
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: backend/deploy/vm.sh "${{ secrets.VM_HOST }}" ~/vm_key

      - name: Health check through Caddy
        if: steps.ready.outputs.ok == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          host="${DOMAIN:-${VM_HOST#*@}.sslip.io}"
          url="https://$host/api/health"
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "$url" | grep -q '"ok":true'; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Health check attempt $attempt failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "Health check failed after 3 attempts: $url" >&2
          exit 1
