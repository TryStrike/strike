[workspace]
resolver = "2"
members = ["crates/core", "crates/server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "query"] }
tower-http = { version = "0.6", features = ["trace", "cors", "set-header", "catch-panic"] }
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-float"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.4"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13", features = ["ecdsa"] }
tiny-keccak = { version = "2", features = ["keccak"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
once_cell = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

strike-core = { path = "crates/core" }


[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
